on:
  push:
  workflow_dispatch:

env:
  ProjectName: Blux
  PackagesVersion: 1.2.11

jobs:
  windows:
    name: Windows
    # if: false # always skip job
    runs-on: windows-2022
    strategy:
      matrix:
        include:
        - arch: win-x64
          buildFolder: "VisualStudio2022_CI"
          installerName: install

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'

      - name: Set Variables
        id: set_variables
        uses: ./.github/actions/set-variables
        with:
          os: ${{ matrix.arch }}

      - name: Checkout JUCE
        uses: actions/checkout@v2
        with:
          repository: benkuper/JUCE
          ref: ${{ env.juce-branch }}
          path: JUCE

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.0.2

      - name: Force 64-bit Linker
        shell: powershell
        run: |
          cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && set > %temp%\vcvars.txt"
          Get-Content "$env:temp\vcvars.txt" | Foreach-Object { if ($_ -match "^(.*?)=(.*)$") { Set-Content "env:\$($matches[1])" $matches[2] }}
     
      - name: Build
        run:  msbuild "Builds/VisualStudio2022_CI/${{ env.ProjectName }}.sln" /p:PreferredToolArchitecture=x64 /m /verbosity:normal /p:Configuration=${{ steps.set_variables.outputs.config }}

      - name: Create Package
        id: create_package
        shell: powershell
        run: |
          Set-Variable -Name "PKGNAME" -Value "${{ env.ProjectName }}-${{ steps.set_variables.outputs.suffix }}"
          Invoke-WebRequest "${{ secrets.DEPDIRURL }}${{ env.ProjectName }}-win-x64-${{ steps.set_variables.outputs.dep }}-dependencies.zip" -OutFile ./deps.zip
          7z e deps.zip -aoa
          if ($LASTEXITCODE -ne 0) { throw 'Dependency extraction failed' }

          # Blux uses Chataigne's Windows playback runtime.
          $mpvPackage = Join-Path $env:RUNNER_TEMP 'Chataigne-win-x64-release-dependencies.zip'
          Invoke-WebRequest 'https://benjamin.kuperberg.fr/chataigne/user/data/Chataigne-win-x64-release-dependencies.zip' -OutFile $mpvPackage
          tar.exe -xf $mpvPackage libmpv-2.dll mpv-licenses
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath './libmpv-2.dll' -PathType Leaf)) { throw 'Could not stage libmpv-2.dll' }
          Set-Content -LiteralPath './mpv-licenses/source-url.txt' -Value 'https://benjamin.kuperberg.fr/chataigne/user/data/Chataigne-win-x64-mpv-sources.tar.xz'

          &"C:/Program Files (x86)/Inno Setup 6/ISCC.exe" "${{ github.workspace }}/install.iss" /O. /F$PKGNAME
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          echo "::set-output name=pkg-name::$PKGNAME.exe"
        working-directory: ./Binaries/CI/App

      - name: Upload
        uses: ./.github/actions/upload
        with:
          pkg-name: ./Binaries/CI/App/${{ steps.create_package.outputs.pkg-name }}
          url: ${{ secrets.UPLOADURL }}
          pass: ${{ secrets.UPLOADPASS }}

  osx:
    # if: false # tmp disable
    name: OSX
    runs-on: macos-15
    
    strategy:
      matrix:
        include:
        - arch: x86_64
          suffix: intel
          config: Release

        - arch: arm64
          suffix: silicon
          config: ReleaseSilicon
        
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'
          
      - name: Set Variables
        id: set_variables
        uses: ./.github/actions/set-variables
        with:
          os: 'osx-${{ matrix.suffix }}'

      - name: Checkout JUCE
        uses: actions/checkout@v2
        with:
          repository: benkuper/JUCE
          ref: ${{ env.juce-branch }}
          path: JUCE

      - name: Download Packages 
        run: |
          curl -L -o Packages.dmg 'http://s.sudre.free.fr/Software/files/Packages.dmg'
          hdiutil mount Packages.dmg
          sudo installer -pkg "/Volumes/Packages ${{ env.PackagesVersion }}/Install Packages.pkg" -target /
          hdiutil detach "/Volumes/Packages ${{ env.PackagesVersion }}/"

      - name: Setup XCode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4.0'
          
      - name: Build
        uses: sersoft-gmbh/xcodebuild-action@v2.0.1
        with:
          project: Builds/MacOSX_CI/${{ env.ProjectName }}.xcodeproj
          destination: platform=macOS
          jobs: 2
          action: build
          arch: ${{ matrix.arch }}
          configuration: ${{ matrix.config }}
          use-xcpretty: true

      - name: Create Package
        id: create_package
        run:  |
          packagesbuild ${{ env.ProjectName }}.pkgproj
          PKGNAME=${{ env.ProjectName }}-${{ steps.set_variables.outputs.suffix }}.pkg
          mv ${{ env.ProjectName }}.pkg $PKGNAME
          echo "pkg-name=$PKGNAME" >> $GITHUB_OUTPUT
        working-directory: ./Package

      - name: Upload
        uses: ./.github/actions/upload
        with:
          pkg-name: ./Package/${{ steps.create_package.outputs.pkg-name }}
          url: ${{ secrets.UPLOADURL }}
          pass: ${{ secrets.UPLOADPASS }}
  
  linux:
    # if: false # tmp disable

    name: Linux
    runs-on: ubuntu-22.04
    container: tommagnier/chataigne-linux-x64-build:debian11

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'

      - name: Set Variables
        id: set_variables
        uses: ./.github/actions/set-variables
        with:
          os: 'x64'

      - name: Checkout JUCE
        uses: actions/checkout@v2
        with:
          repository: benkuper/JUCE
          ref: ${{ env.juce-branch }}
          path: JUCE

      - name: Installing dependencies
        id: install_deps
        #shell: bash {0} # Opt out of fail-fast behavior (necessary to ignore fetch errors)
        run: |
          # Most dependencies are already installed in the Docker image. Uncomment the following lines if you need more
          # apt-get update && apt-get install ...

          cd $GITHUB_WORKSPACE
          wget "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod a+x appimagetool-x86_64.AppImage

      # - name: Start SSH via ngrok
      #   uses: P3TERX/ssh2actions@main
      #   with:
      #     mode: ngrok
      #   env:
      #     # After sign up on the https://ngrok.com
      #     # You can find this token here: https://dashboard.ngrok.com/auth/your-authtoken
      #     NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
          
      #     # ngrok server region [us, eu, au, ap, sa, jp, in] (optional, default: us)
      #     # You can find this server region here: https://ngrok.com/docs#global-locations
      #     NGROK_REGION: us

      #     # This password you will use when authorizing via SSH
      #     SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}

      - name: Build
        run: |
          cd $GITHUB_WORKSPACE/Builds/LinuxMakefile
          gcc --version
          make -j2 CONFIG=Release

      - name: Create AppImage
        id: create_package
        run: |
          mkdir -p ${{ env.ProjectName }}.AppDir/usr/bin/
          cp build/${{ env.ProjectName }} ${{ env.ProjectName }}.AppDir/usr/bin/

          PKGNAME=${{ env.ProjectName }}-linux-${{ steps.set_variables.outputs.suffix }}.AppImage
          echo "pkg-name=$PKGNAME" >> $GITHUB_OUTPUT
          ARCH=x86_64 $GITHUB_WORKSPACE/appimagetool-x86_64.AppImage --appimage-extract-and-run ${{ env.ProjectName }}.AppDir $PKGNAME
        working-directory: ./Builds/LinuxMakefile

      - name: Upload
        uses: ./.github/actions/upload
        with:
          pkg-name: ./Builds/LinuxMakefile/${{ steps.create_package.outputs.pkg-name }}
          url: ${{ secrets.UPLOADURL }}
          pass: ${{ secrets.UPLOADPASS }}
  
  raspberrypi:
    name: Raspberry Pi (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: armhf
          deb_arch: armhf
          gnu_type: arm-linux-gnueabihf
          arch_flags: "-march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard"
          buildFolder: Raspberry
          servusFolder: raspberry

        - arch: aarch64
          deb_arch: arm64
          gnu_type: aarch64-linux-gnu
          arch_flags: "-march=armv8-a"
          buildFolder: Raspberry64
          servusFolder: raspberry64

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - name: Set Variables
        id: set_variables
        uses: ./.github/actions/set-variables
        with:
          os: ${{ matrix.arch }}

      - name: Checkout JUCE
        uses: actions/checkout@v5
        with:
          repository: benkuper/JUCE
          ref: ${{ env.juce-branch }}
          path: JUCE

      - name: Install cross-compiler and target libraries
        env:
          DEB_ARCH: ${{ matrix.deb_arch }}
          GNU_TYPE: ${{ matrix.gnu_type }}
        run: |
          sudo dpkg --add-architecture "$DEB_ARCH"
          # Use the same Ubuntu-signed mirrors as Chataigne for amd64 and ARM.
          for suite in jammy jammy-updates jammy-security; do
            echo "deb [arch=amd64] https://mirrors.mit.edu/ubuntu $suite main universe"
            echo "deb [arch=$DEB_ARCH] https://mirrors.mit.edu/ubuntu-ports $suite main universe"
          done | sudo tee /etc/apt/sources.list

          sudo apt-get -o Acquire::Retries=5 -o Acquire::https::Timeout=30 --error-on=any update

          # Both architectures must use the same version, even while mirrors sync.
          native_headers=linux-libc-dev:amd64
          target_headers="linux-libc-dev:$DEB_ARCH"
          headers_version=$(comm -12 \
            <(apt-cache madison "$native_headers" | awk '{print $3}' | sort -u) \
            <(apt-cache madison "$target_headers" | awk '{print $3}' | sort -u) | sort -V | tail -n 1)
          if [[ -z "$headers_version" ]]; then
            echo "::error::No shared linux-libc-dev version for amd64 and $DEB_ARCH"
            exit 1
          fi

          sudo apt-get -o Acquire::Retries=5 -o Acquire::https::Timeout=30 install -y --no-install-recommends --allow-downgrades \
            "g++-$GNU_TYPE" "$native_headers=$headers_version" "$target_headers=$headers_version" \
            "libasound2-dev:$DEB_ARCH" "libjack-jackd2-dev:$DEB_ARCH" ladspa-sdk \
            "libfreetype6-dev:$DEB_ARCH" "libfontconfig1-dev:$DEB_ARCH" \
            "libx11-dev:$DEB_ARCH" "libxcomposite-dev:$DEB_ARCH" "libxcursor-dev:$DEB_ARCH" \
            "libxinerama-dev:$DEB_ARCH" "libxext-dev:$DEB_ARCH" "libxrandr-dev:$DEB_ARCH" \
            "libwebkit2gtk-4.0-dev:$DEB_ARCH" "libgl1-mesa-dev:$DEB_ARCH" \
            "libcurl4-openssl-dev:$DEB_ARCH" "libssl-dev:$DEB_ARCH" \
            "libbluetooth-dev:$DEB_ARCH" "libusb-1.0-0-dev:$DEB_ARCH" "libhidapi-dev:$DEB_ARCH"

      - name: Cross-compile Blux
        env:
          GNU_TYPE: ${{ matrix.gnu_type }}
          PKG_CONFIG_LIBDIR: /usr/lib/${{ matrix.gnu_type }}/pkgconfig:/usr/share/pkgconfig
          ARCH_FLAGS: ${{ matrix.arch_flags }}
        working-directory: ./Builds/${{ matrix.buildFolder }}
        run: |
          unset PKG_CONFIG_PATH
          make -j"$(nproc)" CONFIG=Release \
            CC="$GNU_TYPE-gcc" CXX="$GNU_TYPE-g++" AR="$GNU_TYPE-ar" STRIP="$GNU_TYPE-strip" \
            JUCE_ARCH_LABEL="${{ matrix.arch }}" TARGET_ARCH="$ARCH_FLAGS"

      - name: Create AppImage
        id: create_package
        env:
          ARCH: ${{ matrix.arch }}
          GNU_TYPE: ${{ matrix.gnu_type }}
        run: |
          appdir="$ProjectName.AppDir"
          binary="build/$ProjectName"
          libdir="/usr/lib/$GNU_TYPE"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/lib"
          # The AppDir template contains libraries from the old Bullseye build.
          find "$appdir/usr/lib" -mindepth 1 -maxdepth 1 \( -type f -o -type l \) -delete
          cp "$binary" "$appdir/usr/bin/"
          ln -sfn blux.png "$appdir/.DirIcon"
          cp -L "../../External/servus/lib/${{ matrix.servusFolder }}/libServus.so" "$appdir/usr/lib/libServus.so.6"
          cp -L "$libdir/libbluetooth.so.3" "$libdir/libusb-1.0.so.0" "$libdir/libhidapi-hidraw.so.0" "$appdir/usr/lib/"

          # Verify the target ABI before shipping the AppImage.
          max_glibc=$("$GNU_TYPE-objdump" -T "$binary" | sed -nE 's/.*GLIBC_([0-9.]+).*/\1/p' | sort -V | tail -n 1)
          if [[ -z "$max_glibc" ]] || ! dpkg --compare-versions "$max_glibc" le 2.35; then
            echo "::error::Expected glibc 2.35 or earlier, found ${max_glibc:-no versioned symbols}"
            exit 1
          fi
          echo "Highest required glibc version: $max_glibc"
          needed=$("$GNU_TYPE-readelf" -d "$binary")
          if [[ "$needed" =~ lib(ssl|crypto)\.so\.1\.1 ]]; then
            echo '::error::Raspberry Pi build still links against OpenSSL 1.1'
            exit 1
          fi

          tool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          curl --fail --location --retry 3 --output "$tool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$tool"
          pkg_name="$ProjectName-linux-${{ steps.set_variables.outputs.suffix }}.AppImage"
          "$tool" --appimage-extract-and-run --no-appstream "$appdir" "$pkg_name"
          echo "pkg-name=$pkg_name" >> "$GITHUB_OUTPUT"
        working-directory: ./Builds/${{ matrix.buildFolder }}

      - name: Upload
        uses: ./.github/actions/upload
        with:
          pkg-name: ./Builds/${{ matrix.buildFolder }}/${{ steps.create_package.outputs.pkg-name }}
          url: ${{ secrets.UPLOADURL }}
          pass: ${{ secrets.UPLOADPASS }}
